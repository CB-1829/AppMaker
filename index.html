<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>.docweb Runtime Engine</title>

  <!-- Dynamic Inline PWA Manifest -->
  <link rel="manifest" id="manifest-placeholder" />

  <style>
    /* Pure invisible runtime: absolute zero UI or margins */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #installation-gatekeeper {
      padding: 20px;
      max-width: 600px;
    }

    .hidden {
      display: none !important;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      position: fixed;
      inset: 0;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <!-- ===================================================================== -->
  <!-- VIEW 1: INSTALLATION GUIDE (Visible ONLY when Uninstalled)            -->
  <!-- ===================================================================== -->
  <div id="installation-gatekeeper" class="hidden">
    <h2>.docweb Engine - Installation Required</h2>
    <p>To execute <code>.docweb</code> files, this web app must first be installed.</p>
    
    <p><strong id="route-id-tag">Session ID: Pending</strong></p>

    <div style="margin-top: 15px;">
      <button id="install-btn" style="padding: 8px 16px;">Install .docweb Engine</button>
      <button id="simulate-install-btn" style="padding: 8px 16px;">[Dev] Confirm Installation</button>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- VIEW 2: EXECUTION CANVAS (Renders raw .docweb HTML)                    -->
  <!-- ===================================================================== -->
  <iframe id="docweb-render-frame" class="hidden"></iframe>

  <script>
    const CACHE_NAME = 'docweb-system-v1';
    const INSTALL_MARKER_PATH = '/docweb-installed-marker.json';

    let deferredInstallPrompt = null;
    let currentSessionId = '';

    function setupDynamicManifest() {
      const manifestData = {
        "name": ".docweb Executable Engine",
        "short_name": "DocWeb",
        "start_url": window.location.origin + window.location.pathname,
        "display": "standalone",
        "icons": [
          {
            "src": "https://placehold.co/192x192/000000/ffffff?text=.docweb",
            "sizes": "192x192",
            "type": "image/png"
          }
        ],
        "file_handlers": [
          {
            "action": window.location.pathname,
            "accept": {
              "application/x-docweb": [".docweb", ".html"],
              "text/html": [".docweb", ".html"]
            }
          }
        ]
      };

      const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
      const manifestUrl = URL.createObjectURL(manifestBlob);
      document.getElementById('manifest-placeholder').setAttribute('href', manifestUrl);
    }

    function ensureSessionIdInUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      let id = urlParams.get('id');

      if (!id) {
        id = 'doc_' + Math.random().toString(36).substring(2, 8) + Date.now().toString(36).substring(4);
        urlParams.set('id', id);
        const newUrl = window.location.pathname + '?' + urlParams.toString() + window.location.hash;
        window.history.replaceState({ path: newUrl }, '', newUrl);
      }

      currentSessionId = id;
      const tag = document.getElementById('route-id-tag');
      if (tag) tag.textContent = `Session ID: ${currentSessionId}`;
    }

    async function verifyInstallationCache() {
      try {
        if (!('caches' in window)) return false;
        const cache = await caches.open(CACHE_NAME);
        const response = await cache.match(INSTALL_MARKER_PATH);
        if (response) {
          const data = await response.json();
          return data && data.installed === true;
        }
      } catch (err) {
        console.warn('Cache check warning:', err);
      }
      return false;
    }

    async function writeInstallationCacheMarker() {
      if (!('caches' in window)) return;
      const markerData = {
        installed: true,
        installedAt: new Date().toISOString(),
        engine: ".docweb Execution Platform"
      };
      const response = new Response(JSON.stringify(markerData, null, 2), {
        headers: { 'Content-Type': 'application/json' }
      });
      const cache = await caches.open(CACHE_NAME);
      await cache.put(INSTALL_MARKER_PATH, response);
    }

    async function clearCacheMarker() {
      if ('caches' in window) {
        const cache = await caches.open(CACHE_NAME);
        await cache.delete(INSTALL_MARKER_PATH);
        location.reload();
      }
    }

    async function registerServiceWorker() {
      if ('serviceWorker' in navigator) {
        const swCode = `
          const CACHE_NAME = '${CACHE_NAME}';
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
          self.addEventListener('fetch', (e) => {
            e.respondWith(
              caches.match(e.request).then(cached => cached || fetch(e.request).catch(() => cached))
            );
          });
        `;
        try {
          const blob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(blob);
          await navigator.serviceWorker.register(swUrl);
        } catch (err) {
          console.log('SW Note:', err);
        }
      }
    }

    function executeDocwebHtml(htmlContent, fileName = 'Opened File') {
      document.title = `${fileName}`;
      
      const iframe = document.getElementById('docweb-render-frame');
      
      // Hide installation guide if present
      document.getElementById('installation-gatekeeper').classList.add('hidden');

      // Render full screen
      iframe.classList.remove('hidden');
      iframe.srcdoc = htmlContent;
    }

    function openFilePayload(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const content = e.target.result;
        const payloadKey = `docweb_payload_${currentSessionId}`;
        
        if (!sessionStorage.getItem(payloadKey)) {
          // Render directly in current tab
          sessionStorage.setItem(payloadKey, content);
          sessionStorage.setItem(`docweb_name_${currentSessionId}`, file.name);
          executeDocwebHtml(content, file.name);
        } else {
          // Open new tab with new session ID for subsequent file
          const newId = 'doc_' + Math.random().toString(36).substring(2, 8) + Date.now().toString(36).substring(4);
          const newUrl = window.location.pathname + '?id=' + newId;

          sessionStorage.setItem(`docweb_payload_${newId}`, content);
          sessionStorage.setItem(`docweb_name_${newId}`, file.name);

          window.open(newUrl, '_blank');
        }
      };
      reader.readAsText(file);
    }

    async function checkAndRenderAppState() {
      const isCacheInstalled = await verifyInstallationCache();
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      const isInstalled = isCacheInstalled || isStandalone;

      const gatekeeperEl = document.getElementById('installation-gatekeeper');

      if (!isInstalled) {
        // UNINSTALLED: Show installation gatekeeper
        gatekeeperEl.classList.remove('hidden');
      } else {
        // INSTALLED: Hide installation guide completely. Zero UI displayed.
        gatekeeperEl.classList.add('hidden');

        // Check if session storage contains payload for this ID
        const payloadKey = `docweb_payload_${currentSessionId}`;
        const nameKey = `docweb_name_${currentSessionId}`;
        const existingPayload = sessionStorage.getItem(payloadKey);

        if (existingPayload) {
          const fileName = sessionStorage.getItem(nameKey) || 'Document';
          executeDocwebHtml(existingPayload, fileName);
        }
      }
    }

    function initializeEventListeners() {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
      });

      document.getElementById('install-btn').addEventListener('click', async () => {
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          const { outcome } = await deferredInstallPrompt.userChoice;
          if (outcome === 'accepted') {
            await writeInstallationCacheMarker();
            checkAndRenderAppState();
          }
          deferredInstallPrompt = null;
        } else {
          await writeInstallationCacheMarker();
          checkAndRenderAppState();
        }
      });

      document.getElementById('simulate-install-btn').addEventListener('click', async () => {
        await writeInstallationCacheMarker();
        await checkAndRenderAppState();
      });

      // Allow dragging and dropping .docweb / .html files anywhere on the blank window
      window.addEventListener('dragover', (e) => e.preventDefault());
      window.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          openFilePayload(e.dataTransfer.files[0]);
        }
      });

      // OS File Launch Queue Handler
      if ('launchQueue' in window) {
        window.launchQueue.setConsumer(async (launchParams) => {
          if (!launchParams.files.length) return;
          for (const handle of launchParams.files) {
            const file = await handle.getFile();
            openFilePayload(file);
          }
        });
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      setupDynamicManifest();
      ensureSessionIdInUrl();
      await registerServiceWorker();
      initializeEventListeners();
      await checkAndRenderAppState();
    });
  </script>
</body>
</html>
